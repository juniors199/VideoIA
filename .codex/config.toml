# Estudio de videos: configuração do Codex para esta pasta.
# Só vale quando a pasta está marcada como confiável (o Codex pergunta na primeira vez que você abre).
# Fonte: https://learn.chatgpt.com/docs/config-file/config-reference (checado em 18/10/2026).
# Não fixamos modelo: use o padrão do seu plano.

# Escreve só dentro desta pasta e pergunta antes de sair dela ("Ask for approval").
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
# A narração (ElevenLabs, Fish Audio) e o download do Chromium precisam de internet.
network_access = true
